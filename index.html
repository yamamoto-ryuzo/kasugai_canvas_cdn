<body><h1>KASUGAI Canvas CDN</h1>
<p>kasugai_canvas の web/ を配信日ベースでバージョン管理した配信領域です。<br>
エンジンURL例: <code>&lt;このホスト&gt;/&lt;version&gt;/leaflet/?kasc=local</code></p>
<ul>
  <li><a href="latest/">latest/</a> — 最新スナップショット（追従）</li>
  <li><a href="2026-10-25/">2026-10-25/</a> — この日付版（不変）</li>
</ul>
<p>使い方: エクスポートフォルダの <code>&lt;engine&gt;.html</code> を file:// で開き、
ローカル Canvas が無ければホストURLに <code>&lt;このホスト&gt;/latest/</code> を指定。
バージョン固定したい場合は日付版を指定してください。</p>
